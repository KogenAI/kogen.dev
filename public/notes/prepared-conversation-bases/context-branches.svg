<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
  <title id="title">Prepare shared context, then branch into feature tasks</title>
  <desc id="desc">A project base supplies purpose, vocabulary and rules. A feature base inherits that context and adds the feature workflow. Onboarding and another feature task each inherit both bases and add their own current evidence. The task branches do not inherit each other's work.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#646464"/></marker></defs>
  <rect width="960" height="820" rx="20" fill="#f6f5f1"/>
  <g font-family="Arial, sans-serif" fill="#191919">
    <text x="48" y="60" font-size="27" font-weight="700">Reuse the shared beginning of each request.</text>
    <text x="48" y="94" font-size="19" fill="#555">Project context first, new task input last.</text>
    <rect x="210" y="134" width="540" height="130" rx="14" fill="white" stroke="#bcbcb7" stroke-width="2"/>
    <text x="242" y="171" font-size="16" fill="#666">PROJECT BASE</text>
    <text x="242" y="205" font-size="23" font-weight="700">Kogen</text>
    <text x="242" y="238" font-size="19">Stable project files and instructions</text>
    <path d="M480 266 V309" fill="none" stroke="#646464" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="210" y="322" width="540" height="148" rx="14" fill="white" stroke="#191919" stroke-width="2"/>
    <rect x="211" y="323" width="538" height="36" rx="13" fill="#e4e8e2"/>
    <rect x="211" y="344" width="538" height="15" fill="#e4e8e2"/>
    <text x="242" y="347" font-size="16">Shared project prefix</text>
    <text x="242" y="398" font-size="23" font-weight="700">Kogen feature base</text>
    <text x="242" y="434" font-size="19">Adds the shared feature workflow</text>
    <path d="M480 472 V511 H255 V547 M480 511 H705 V547" fill="none" stroke="#646464" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M255 529 V547" fill="none" stroke="#646464" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="560" width="414" height="170" rx="14" fill="white" stroke="#bcbcb7" stroke-width="2"/>
    <rect x="498" y="560" width="414" height="170" rx="14" fill="white" stroke="#bcbcb7" stroke-width="2"/>
    <text x="74" y="595" font-size="17" fill="#53604e">Inherits the shared beginning</text>
    <text x="524" y="595" font-size="17" fill="#53604e">Inherits the shared beginning</text>
    <text x="74" y="639" font-size="23" font-weight="700">Kogen onboarding</text>
    <text x="524" y="639" font-size="23" font-weight="700">Another feature</text>
    <text x="74" y="676" font-size="19">Adds the onboarding question</text>
    <text x="74" y="704" font-size="19">and current repository details</text>
    <text x="524" y="676" font-size="19">Adds its own request and</text>
    <text x="524" y="704" font-size="19">current feature details</text>
    <text x="480" y="779" text-anchor="middle" font-size="19" fill="#555">Shared tokens can get the cached rate; new input is added per task.</text>
  </g>
</svg>
